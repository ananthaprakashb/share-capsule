<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-label="Moonlit lotus pond card"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#271347"/><stop offset=".58" stop-color="#914d8f"/><stop offset="1" stop-color="#1a2f68"/></linearGradient><linearGradient id="water" x2="0" y2="1"><stop stop-color="#36417d"/><stop offset="1" stop-color="#0b1b48"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="18"/></filter></defs><style>@keyframes ripple{0%,100%{transform:scaleX(.78);opacity:.15}50%{transform:scaleX(1.12);opacity:.55}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}@keyframes glow{50%{opacity:.75}}.rip{transform-origin:center;animation:ripple 4s ease-in-out infinite}.flower{transform-box:fill-box;transform-origin:center;animation:bob 4.5s ease-in-out infinite}.moon{animation:glow 5s ease-in-out infinite}</style><rect width="1080" height="1350" fill="url(#sky)"/><circle class="moon" cx="330" cy="225" r="145" fill="#fff2bd"/><circle cx="330" cy="225" r="210" fill="#fff1b0" opacity=".15" filter="url(#g)"/><path d="M0 610Q200 500 400 610T800 590T1080 620V820H0Z" fill="#4a316a" opacity=".75"/><path d="M610 540H840V700H610Z" fill="#1b1c35"/><path d="M590 550L725 410L860 550Z" fill="#15172f"/><g fill="#ffd36e"><rect x="660" y="570" width="50" height="65"/><rect x="760" y="570" width="48" height="65"/></g><rect y="690" width="1080" height="660" fill="url(#water)"/><g class="rip" fill="none" stroke="#d9c5ff" stroke-width="6" opacity=".3"><ellipse cx="310" cy="890" rx="170" ry="25"/><ellipse cx="760" cy="1030" rx="230" ry="35"/><ellipse cx="520" cy="1190" rx="400" ry="48"/></g><g fill="#304d62"><ellipse cx="150" cy="910" rx="100" ry="45"/><ellipse cx="390" cy="1030" rx="125" ry="55"/><ellipse cx="690" cy="875" rx="110" ry="48"/><ellipse cx="900" cy="1120" rx="135" ry="58"/><ellipse cx="260" cy="1230" rx="145" ry="62"/></g><g class="flower" transform="translate(18