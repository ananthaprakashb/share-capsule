<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-label="Lighthouse sunrise coast card"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#9c4e5e"/><stop offset=".55" stop-color="#ff8d4a"/><stop offset="1" stop-color="#ffd978"/></linearGradient><linearGradient id="sea" x2="0" y2="1"><stop stop-color="#7d5b7b"/><stop offset="1" stop-color="#25345f"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="18"/></filter></defs><style>@keyframes wave{0%,100%{transform:translateX(-20px);opacity:.35}50%{transform:translateX(24px);opacity:.72}}@keyframes beam{0%,100%{transform:rotate(-18deg);opacity:.1}50%{transform:rotate(18deg);opacity:.38}}@keyframes pulse{50%{opacity:.75;transform:scale(1.04)}}.wave{animation:wave 4s ease-in-out infinite}.beam{transform-box:fill-box;transform-origin:0 50%;animation:beam 5.5s ease-in-out infinite}.sun{transform-box:fill-box;transform-origin:center;animation:pulse 5s ease-in-out infinite}</style><rect width="1080" height="1350" fill="url(#sky)"/><g fill="#ffc78c" opacity=".35"><ellipse cx="150" cy="285" rx="180" ry="65"/><ellipse cx="820" cy="300" rx="250" ry="75"/></g><circle class="sun" cx="820" cy="570" r="175" fill="#fff19c"/><circle cx="820" cy="570" r="245" fill="#ffe783" opacity=".18" filter="url(#glow)"/><path d="M0 640L250 390L470 620L650 455L850 650L1080 470V850H0Z" fill="#7f5067" opacity=".7"/><rect y="780" width="1080" height="570" fill="url(#sea)"/><g class="wave" fill="none" stroke="#ffd9a6" stroke-width="11" opacity=".52"><path d="M0 880Q170 820 340 880T680 880T1080 870"/><path d="M0 1000Q190 930 380 1000T760 990T1080 1000"/><path d="M0 1140Q170 1070 340 1140T680 1140T1080 1130"/><path d="M0 1270Q200 1200 400 1270T800 1260T1080 1270"/></g><g fill="#3b2c45"><ellipse cx="180" cy="850" rx="210" ry="145"/><ellipse cx="400" cy="900" rx="230" ry="165"/><ellipse cx="570" cy="955" rx="180" ry="120"/></g><g transform="translate(130 250)"><path d="M80 600