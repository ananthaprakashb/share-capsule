<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350" role="img" aria-label="Crimson island sunset card"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#3b0717"/><stop offset=".55" stop-color="#d91f3b"/><stop offset="1" stop-color="#ff6b4a"/></linearGradient><linearGradient id="sea" x2="0" y2="1"><stop stop-color="#c62d44"/><stop offset="1" stop-color="#53162e"/></linearGradient><radialGradient id="sun"><stop stop-color="#fff0a4"/><stop offset="1" stop-color="#ff7a4a"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="16"/></filter></defs><style>@keyframes drift{to{transform:translateX(120px)}}@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}@keyframes shimmer{0%,100%{opacity:.25;transform:scaleX(.9)}50%{opacity:.7;transform:scaleX(1.08)}}@keyframes pulse{50%{opacity:.78;transform:scale(1.04)}}.cloud{animation:drift 18s linear infinite}.palm{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out infinite}.shine{transform-origin:center;animation:shimmer 3.8s ease-in-out infinite}.sun{transform-box:fill-box;transform-origin:center;animation:pulse 5s ease-in-out infinite}</style><rect width="1080" height="1350" fill="url(#sky)"/><g class="cloud" opacity=".22" fill="#ff9b85"><ellipse cx="130" cy="330" rx="190" ry="75"/><ellipse cx="840" cy="420" rx="270" ry="90"/></g><circle class="sun" cx="830" cy="760" r="145" fill="url(#sun)"/><rect y="840" width="1080" height="510" fill="url(#sea)"/><g class="shine" fill="#ffc077" opacity=".5"><ellipse cx="830" cy="905" rx="170" ry="18"/><ellipse cx="830" cy="970" rx="230" ry="22"/><ellipse cx="830" cy="1050" rx="300" ry="26"/><ellipse cx="830" cy="1140" rx="380" ry="30"/></g><path d="M0 930Q170 850 330 920T650 920T1080 900V1040H0Z" fill="#3f142a" opacity=".55"/><g fill="#32252c"><ellipse cx="240" cy="930" rx="185" ry="115"/><ellipse cx="480" cy="930" rx="210" ry="135"/><ellipse cx="690" cy="970" rx="170" ry="100"/></g><g><path d="M330 710H700V930H330Z" fill="#544143"/><path d="M305 720L470 540L635 720Z" fill="#2d1f28"/><path d="M500 710L650 575L800 710Z" fill="#351f28"/><g fill="#ffd472"><rect x="405" y="735" width="70" height="100" rx="4"/><rect x="575" y="735" width="80" height="130" rx="4"/><rect x="665" y="750" width="50" height="70" rx="4"/></g></g><g class="palm" fill="#17251f"><path d="M250 850Q280 560 360 260" stroke="#3b2a29" stroke-width="30" fill="none"/><path d="M350 280q-160-120-260-20q150 10 260 55q-100-180-210-150q120 70 225 135q10-210 110-250q-35 140-80 255q170-150 260-70q-130 50-250 100q180-35 230 65q-140-15-245-70Z"/></g><g class="palm" style="animation-delay:-1.7s" fill="#18251f"><path d="M175 900Q180 710 220 510" stroke="#3a2929" stroke-width="22" fill="none"/><path d="M220 520q-120-80-185 5q110-5 180 30q-55-130-140-110q75 50 145 95q10-150 80-185q-25 105-55 185q115-95 175-25q-90 25-170 60q120-15 150 55q-95-10-170-45Z"/></g><g fill="#ffd86a"><circle cx="130" cy="420" r="8"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="510" cy="490" r="6"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle><circle cx="730" cy="560" r="7"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle></g></svg>