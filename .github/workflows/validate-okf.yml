name: Validate OKF bundle

on:
  pull_request:
    paths:
      - 'okf/**'
      - 'llms.txt'
      - 'robots.txt'
      - 'sitemap.xml'
      - '_headers'
      - 'scripts/validate-okf.mjs'
      - '.github/workflows/validate-okf.yml'
  push:
    branches: [main]
    paths:
      - 'okf/**'
      - 'llms.txt'
      - 'robots.txt'
      - 'sitemap.xml'
      - '_headers'
      - 'scripts/validate-okf.mjs'
      - '.github/workflows/validate-okf.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate OKF structure and links
        run: node scripts/validate-okf.mjs
