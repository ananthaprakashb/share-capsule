name: Deploy jobs subdomain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/jobs-subdomain/**'
      - '.github/workflows/deploy-jobs-subdomain.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/jobs-subdomain
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/jobs-subdomain
          command: deploy
