name: Cloudflare Functions Check

on:
  pull_request:
    paths:
      - 'functions/**'
      - 'migrations/**'
      - 'wrangler.jsonc'
      - '.github/workflows/cloudflare-functions-check.yml'
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'migrations/**'
      - 'wrangler.jsonc'
      - '.github/workflows/cloudflare-functions-check.yml'

permissions:
  contents: read

jobs:
  validate-pages-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Wrangler configuration
        run: npx --yes wrangler@latest pages functions build functions --outdir=.cloudflare/functions-build --project-directory=.
      - name: Confirm expected API routes were generated
        shell: bash
        run: |
          test -f .cloudflare/functions-build/index.js
          grep -R "api/place-votes" .cloudflare/functions-build .cloudflare 2>/dev/null || {
            echo "Voting route was not found in the generated Pages Functions output"
            exit 1
          }
          grep -R "api/tamil-poem" .cloudflare/functions-build .cloudflare 2>/dev/null || {
            echo "Tamil poem route was not found in the generated Pages Functions output"
            exit 1
          }
      - name: Confirm voting source and migration exist
        run: |
          test -f functions/api/place-votes/index.js
          test -f 'functions/api/place-votes/[placeId].js'
          test -f functions/api/tamil-poem.js
          test -f migrations/0001_place_votes.sql
