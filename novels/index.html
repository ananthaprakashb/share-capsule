<style>
:root{--paper:#f7f1e6;--ink:#211d18;--muted:#786f64;--line:#dfd5c7;--card:#fffdf8;--accent:#7a4d2a;--w:720px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select,input{font:inherit;color:inherit}.shell{width:min(1080px,100%);margin:auto;padding:18px 18px 90px}.top,.readerBar{display:flex;align-items:center;gap:10px}.top{justify-content:space-between}.brand{font-size:20px;font-weight:900;color:inherit;text-decoration:none}.hero{max-width:720px;padding:52px 0 28px}.hero small{font-weight:850;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}.hero h1{font:700 clamp(46px,10vw,78px)/.94 Georgia,serif;letter-spacing:-.05em;margin:10px 0 14px}.hero p,.status{color:var(--muted);line-height:1.6}.library{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}.book{border:1px solid var(--line);background:var(--card);border-radius:24px;padding:14px;display:flex;flex-direction:column;text-align:left;cursor:pointer;box-shadow:0 14px 35px #3d2d1c0f}.cover{aspect-ratio:2/3;border-radius:18px;overflow:hidden;background:linear-gradient(145deg,#17233a,#3a315a);display:grid;place-items:center;color:#fff;font:700 25px Georgia,serif;text-align:center}.cover img{width:100%;height:100%;object-fit:cover}.book h2{font:700 28px/1.05 Georgia,serif;margin:14px 6px 8px}.book p{color:var(--muted);margin:0 6px 18px}.open{font-weight:850;margin:6px}.reader{display:none}.reader.active{display:block}.hidden{display:none!important}.readerInner{width:min(100%,var(--w));margin:auto}.readerBar{position:sticky;top:0;z-index:10;padding:10px 0;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.readerBar button{border:0;background:transparent;padding:10px;font-weight:800}.spacer{flex:1}.progress{height:3px;background:var(--line);position:sticky;top:65px;z-inde gin:55px 0}.chapterNav button{min-height:58px;border:1px solid var(--line);background:var(--card);border-radius:16px;font-weight:850}.chapterNav button:disabled{opacity:.35}.drawer{position:fixed;inset:0 0 0 auto;width:min(88vw,380px);background:var(--card);z-index:30;padding:24px;transform:translateX(105%);transition:.22s;box-shadow:-20px 0 60px #0003}.drawer.open{transform:none}.drawer .close{border:1px solid var(--line);background:transparent;border-radius:50%;width:42px;height:42px}.chapterList button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px}.chapterList .active{font-weight:900;color:var(--accent)}.settings label{display:block;font-weight:800;margin:18px 0 8px}.settings select,.settings input{width:100%}body.dark{--paper:#181715;--ink:#eee8df;--muted:#aaa095;--line:#37332e;--card:#211f1c;--accent:#d9a574}body.sepia{--paper:#efe2c8;--ink:#3b2b20;--muted:#756252;--line:#d4c09e;--card:#f6ead1;--accent:#85542d}@media(max-width:600px){.listen{flex-wrap:wrap}.audioStatus{width:100%;text-align:center}.hero{padding-top:34px}}
</style></head><body><main class="shell"><section id="libraryView"><header class="top"><a class="brand" href="../">Share Capsule</a><button id="refresh">↻</button></header><div class="hero"><small>Share Capsule Reader</small><h1>Novels</h1><p>Immersive stories you can read or listen to, chapter by chapter.</p></div><div id="status" class="status">Loading Stories repository…</div><div id="library" class="library"></div></section>
<section id="reader" class="reader"><div class="readerInner"><div class="readerBar"><button id="back">← Library</button><span class="spacer"></span><button id="chapters">☰ Chapters</button><button id="prefs">Aa</button></div><div class="progress"><span id="progress"></span></div><div id="scene" class="scene"><div class="sceneText"><small id="sceneMood">A Share Capsule Story</small><h1 id="cinemaTitle"></h1><div id="cinemaMeta"></div></div></div><header class="chapterHead"><div id="novelName" class="muted"></div><h2 id="chapterTitle"></h2><div id="chapterCount" class="muted"></div></header><div class="listen"><button id="play" class="play" aria-label="Read chapter aloud">▶</button><select id="voice" aria-label="Narrator voice"><option>Loading voices…</option></select><select id="rate" class="rate" aria-label="Reading speed"><option value="0.8">0.8×</option><option value="0.9">0.9×</option><option value="1" selected>1×</option><option value="1.1">1.1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select><span id="audioStatus" class="audioStatus">Read aloud</span></div><article id="prose" class="prose"></article><nav class="chapterNav"><button id="prev">← Previous</button><button id="next">Next →</button></nav></div></section></main>
<aside id="chapterDrawer" class="drawer"><button class="close" onclick="closeDrawers()">×</button><h2>Chapters</h2><div id="chapterList" class="chapterList"></div></aside><aside id="settingsDrawer" class="drawer settings"><button class="close" onclick="closeDrawers()">×</button><h2>Reading settings</h2><label>Theme</label><select id="theme"><option value="">Paper</option><option value="sepia">Sepia</option><option value="dark">Dark</option></select><label>Text size</label><input id="fontSize" type="range" min="17" max="28" value="20"><label>Line spacing</label><input id="lineHeight" type="range" min="15" max="24" value="19"></aside>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>
const OWNER='ananthaprakashb',REPO='Stories',BRANCH='main',API='https://api.github.com/repos/'+OWNER+'/'+REPO;let books=[],currentBook=null,currentChapter=0,currentText='',chapterMeta={},serverAudio=null,speaking=false,paused=false;const $=id=>document.getElementById(id);const pretty=s=>decodeURIComponent(s).replace(/[-_]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function asset(book,v){if(!v)return'';if(/^https?:/i.test(v))return v;return 'https://raw.githubusercontent.com/'+OWNER+'/'+REPO+'/'+BRANCH+'/'+book.path+'/'+v.replace(/^\.\//,'')}async function api(path){const r=await fetch(API+path,{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw Error('GitHub '+r.status);return r.json()}function natural(a,b){return a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'})}
async function loadLibrary(){$('status').textContent='Loading Stories repository…';try{const root=await api('/contents?ref='+BRANCH);books=await Promise.all(root.filter(x=>x.type==='dir').map(async d=>{const files=await api('/contents/'+encodeURIComponent(d.path)+'?ref='+BRANCH);const chapters=files.filter(f=>f.type==='file'&&/\.(md|markdown|txt)$/i.test(f.name)&&!/^readme/i.test(f.name)).sort(natural);let meta={};const mf=files.find(f=>f.type==='file'&&f.name.toLowerCase()==='book.json');if(mf)try{meta=await(await fetch(mf.download_url)).json()}catch{}return{name:meta.title||pretty(d.name),path:d.path,chapters,meta}}));books=books.filter(b=>b.chapters.length);$('status').textContent=books.length+' novel'+(books.length===1?'':'s')+' available';$('library').innerHTML=books.map((b,i)=>{const cover=asset(b,b.meta.artwork);return '<button class="book" data-i="'+i+'"><div class="cover">'+(cover?'<img src="'+esc(cover)+'" alt="'+esc(b.name)+' cover">':esc(b.name))+'</div><h2>'+esc(b.name)+'</h2><p>'+esc(b.meta.subtitle||b.meta.description||b.chapters.length+' chapters')+'</p><span class="open">Start reading →</span></button>'}).join('');document.querySelectorAll('.book').forEach(x=>x.onclick=()=>openBook(+x.dataset.i))}catch(e){$('status').textContent='Unable to load Stories: '+e.message;console.error(e)}}
async function openBook(i){currentBook=books[i];let saved={};try{saved=JSON.parse(localStorage.getItem('novel-progress:'+currentBook.path)||'{}')}catch{}currentChapter=Math.min(saved.chapter||0,currentBook.chapters.length-1);$('libraryView').classList.add('hidden');$('reader').classList.add('active');await loadChapter(currentChapter)}
function front(raw){if(!raw.startsWith('---'))return{meta:{},body:raw};const lines=raw.replace(/\r/g,'').split('\n'),end=lines.indexOf('---',1);if(end<0)return{meta:{},body:raw};const meta={};lines.slice(1,end).forEach(line=>{const p=line.indexOf(':');if(p>0)meta[line.slice(0,p).trim().toLowerCase()]=line.slice(p+1).trim().replace(/^['"]|['"]$/g,'')});return{meta,body:lines.slice(end+1).join('\n').trim()}}
function plainText(md){const box=document.createElement('div');box.innerHTML=marked.parse(md);return box.textContent.replace(/\s+/g,' ').trim()}
async function loadChapter(i){stopAudio();currentChapter=i;const ch=currentBook.chapters[i];$('prose').innerHTML='<p>Loading chapter…</p>';try{const r=await fetch(ch.download_url);if(!r.ok)throw Error('Chapter '+r.status);const parsed=front(await r.text());chapterMeta=parsed.meta;currentText=plainText(parsed.body);$('prose').innerHTML=marked.parse(parsed.body);const fallback=pretty(ch.name.replace(/\.(md|markdown|txt)$/i,'').replace(/^\d+[._ -]*/,''));const title=chapterMeta.chapter_title||chapterMeta.title||fallback;$('novelName').textContent=currentBook.name;$('chapterTitle').textContent=title;$('chapterCount').textContent='Chapter '+(i+1)+' of '+currentBook.chapters.length;$('cinemaTitle').textContent=title;$('sceneMood').textContent=(chapterMeta.scene||chapterMeta.mood||'Story')+' · '+currentBook.name;$('cinemaMeta').textContent=chapterMeta.subtitle||('Chapter '+(i+1));const art=chapterMeta.artwork||currentBook.meta.artwork;$('scene').style.backgroundImage=art?'linear-gradient(0deg,#0007,#0001),url("'+asset(currentBook,art)+'")':'';prepareAudio()}catch(e){$('prose').innerHTML='<p>Unable to load chapter: '+esc(e.message)+'</p>'}renderChapters();$('prev').disabled=i===0;$('next').disabled=i===currentBook.chapters.length-1;localStorage.setItem('novel-progress:'+currentBook.path,JSON.stringify({chapter:i}));scrollTo(0,0)}
function narrationUrl(){return chapterMeta.narration||chapterMeta.audio||chapterMeta.tts_audio||''}function prepareAudio(){stopAudio();const n=narrationUrl();if(n){serverAudio=new Audio(asset(currentBook,n));serverAudio.onended=()=>setAudioState('stopped');$('audioStatus').textContent='Studio narration'}else $('audioStatus').textContent=('speechSynthesis'in window)?'Device voice':'Audio unavailable'}
function populateVoices(){if(!('speechSynthesis'in window))return;const voices=speechSynthesis.getVoices(),lang=(chapterMeta.language||currentBook?.meta?.language||document.documentElement.lang||'en').toLowerCase();const sorted=[...voices].sort((a,b)=>{const am=a.lang.toLowerCase().startsWith(lang.split('-')[0])?0:1,bm=b.lang.toLowerCase().startsWith(lang.split('-')[0])?0:1;const ae=/Microsoft|Natural|Online/i.test(a.name)?0:1,be=/Microsoft|Natural|Online/i.test(b.name)?0:1;return am-bm||ae-be||a.name.localeCompare(b.name)});$('voice').innerHTML=sorted.map((v,i)=>'<option value="'+i+'">'+esc(v.name)+' · '+esc(v.lang)+(v.default?' · Default':'')+'</option>').join('');$('voice')._voices=sorted;const saved=localStorage.getItem('novel-voice');const idx=sorted.findIndex(v=>v.name===saved);if(idx>=0)$('voice').value=String(idx)}
function chunks(text,max=1800){const out=[];let rest=text;while(rest.length>max){let cut=rest.lastIndexOf('. ',max);if(cut<max*.55)cut=rest.lastIndexOf(' ',max);if(cut<1)cut=max;out.push(rest.slice(0,cut+1));rest=rest.slice(cut+1).trim()}if(rest)out.push(rest);return out}
function speakDevice(){const parts=chunks(currentText);let i=0;const selected=$('voice')._voices?.[+$('voice').value];if(selected)localStorage.setItem('novel-voice',selected.name);function next(){if(!speaking||i>=parts.length){setAudioState('stopped');return}const u=new SpeechSynthesisUtterance(parts[i++]);if(selected)u.voice=selected;u.rate=+$('rate').value;u.lang=selected?.lang||chapterMeta.language||currentBook.meta.language||'en-US';u.onend=next;u.onerror=e=>{if(e.error!=='canceled')console.warn('TTS',e.error);setAudioState('stopped')};speechSynthesis.speak(u)}setAudioState('playing');next()}
function setAudioState(state){speaking=state!=='stopped';paused=state==='paused';$('play').textContent=state==='playing'?'❚❚':'▶';$('play').ariaLabel=state==='playing'?'Pause narration':'Play narration';if(state==='stopped')$('audioStatus').textContent=narrationUrl()?'Studio narration':(('speechSynthesis'in window)?'Device voice':'Audio unavailable')}
function toggleAudio(){if(serverAudio){if(!serverAudio.paused){serverAudio.pause();setAudioState('paused')}else{serverAudio.play().then(()=>setAudioState('playing')).catch(()=>{})}return}if(!('speechSynthesis'in window)||!currentText)return;if(speaking){if(paused){speechSynthesis.resume();setAudioState('playing')}else{speechSynthesis.pause();setAudioState('paused')}}else speakDevice()}
function stopAudio(){if(serverAudio){serverAudio.pause();serverAudio.currentTime=0;serverAudio=null}if('speechSynthesis'in window)speechSynthesis.cancel();speaking=false;paused=false;if($('play'))$('play').textContent='▶'}
function renderChapters(){$('chapterList').innerHTML=currentBook.chapters.map((c,i)=>'<button data-i="'+i+'" class="'+(i===currentChapter?'active':'')+'">'+(i+1)+'. '+esc(pretty(c.name.replace(/\.(md|markdown|txt)$/i,'').replace(/^\d+[._ -]*/,'')))+'</button>').join('');$('chapterList').querySelectorAll('button').forEach(b=>b.onclick=()=>{closeDrawers();loadChapter(+b.dataset.i)})}function closeDrawers(){document.querySelectorAll('.drawer').forEach(x=>x.classList.remove('open'))}
$('play').onclick=toggleAudio;$('voice').onchange=()=>{stopAudio();const v=$('voice')._voices?.[+$('voice').value];if(v)localStorage.setItem('novel-voice',v.name)};$('rate').onchange=()=>{localStorage.setItem('novel-rate',$('rate').value);if(speaking){stopAudio();toggleAudio()}};$('rate').value=localStorage.getItem('novel-rate')||'1';if('speechSynthesis'in window){populateVoices();speechSynthesis.onvoiceschanged=populateVoices()}
$('back').onclick=()=>{stopAudio();$('reader').classList.remove('active');$('libraryView').classList.remove('hidden')};$('prev').onclick=()=>currentChapter&&loadChapter(currentChapter-1);$('next').onclick=()=>currentChapter<currentBook.chapters.length-1&&loadChapter(currentChapter+1);$('chapters').onclick=()=>$('chapterDrawer').classList.add('open');$('prefs').onclick=()=>$('settingsDrawer').classList.add('open');$('refresh').onclick=loadLibrary;const pref=JSON.parse(localStorage.getItem('novel-reader-prefs')||'{}');$('theme').value=pref.theme||'';$('fontSize').value=pref.fontSize||20;$('lineHeight').value=pref.lineHeight||19;function applyPrefs(){document.body.className=$('theme').value;document.documentElement.style.setProperty('--fs',$('fontSize').value+'px');document.documentElement.style.setProperty('--lh',$('lineHeight').value/10);localStorage.setItem('novel-reader-prefs',JSON.stringify({theme:$('theme').value,fontSize:$('fontSize').value,lineHeight:$('lineHeight').value}))}['theme','fontSize','lineHeight'].forEach(id=>$(id).oninput=applyPrefs);applyPrefs();addEventListener('scroll',()=>{if(!$('reader').classList.contains('active'))return;const h=document.documentElement.scrollHeight-innerHeight;$('progress').style.width=(h?Math.min(100,scrollY/h*100):0)+'%'});loadLibrary();
</script><!-- Cloudflare Web Analytics --><script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"0eea133492b342da911e8cc91271e622"}'></script><!-- End Cloudflare Web Analytics --></body></html>
