  <style>
    :root{color-scheme:dark;--bg:#061f25;--bg2:#0b3439;--panel:rgba(8,42,47,.76);--line:rgba(153,242,230,.16);--text:#f5fffd;--muted:#9fd3ce;--teal:#69e0d6;--teal2:#2bb8b2;--gold:#f2c94c;--danger:#ff8f8f;--shadow:0 28px 80px rgba(0,0,0,.34)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100dvh;overflow-x:hidden;color:var(--text);background:radial-gradient(circle at 50% -10%,rgba(58,207,198,.28),transparent 38%),radial-gradient(circle at 10% 88%,rgba(19,114,123,.26),transparent 33%),linear-gradient(160deg,var(--bg2),var(--bg) 54%,#04161b)}body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(to bottom,black,transparent 76%)}button,input{font:inherit}button{touch-action:manipulation}.app{width:min(100%,520px);min-height:100dvh;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:center;position:relative}.card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(11,54,59,.84),rgba(5,31,36,.9));box-shadow:var(--shadow);border-radius:32px;padding:24px 20px 20px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.title{text-align:center;margin-bottom:18px}.title .mark{width:52px;height:52px;border-radius:18px;margin:0 auto 13px;display:grid;place-items:center;background:rgba(40,184,178,.15);border:1px solid rgba(105,224,214,.23);box-shadow:inset 0 0 24px rgba(105,224,214,.08)}.title .mark img{width:46px;height:46px;border-radius:15px}h1{font-size:clamp(24px,7vw,32px);letter-spacing:-.045em;line-height:1.02;margin:0}.subtitle{margin:8px 0 0;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.01em}.ratio{display:inline-flex;align-items:center;gap:7px;margin-top:12px;color:#d8fffb;font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.ratio i{display:block;width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px rgba(242,201,76,.7)}.visual{display:grid;place-items:center;position:relative;min-height:292px;margin:3px 0 4px}.halo,.halo::before,.halo::after{position:absolute;content:"";border-radius:50%;pointer-events:none}.halo{width:238px;height:238px;border:1px solid rgba(105,224,214,.13)}.halo::before{inset:18px;border:1px solid rgba(105,224,214,.08)}.halo::after{inset:-15px;border:1px solid rgba(105,224,214,.055)}.ring{position:absolute;width:252px;height:252px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:4}.ring .track{stroke:rgba(255,255,255,.07)}.ring .progress{stroke:var(--teal);stroke-linecap:round;filter:drop-shadow(0 0 5px rgba(105,224,214,.55));transition:stroke .25s}.breath-orb{width:188px;height:188px;border-radius:50%;position:relative;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.14),transparent 27%),radial-gradient(circle at 50% 55%,rgba(105,224,214,.22),rgba(20,108,111,.17) 55%,rgba(4,30,35,.5) 100%);border:1px solid rgba(146,244,232,.22);box-shadow:inset 0 0 48px rgba(105,224,214,.12),0 0 70px rgba(42,184,178,.12);transform:scale(.82);transition:box-shadow .35s ease,background .35s ease;overflow:hidden}.breath-orb::after{content:"";position:absolute;inset:10px;border-radius:50%;border:1px solid rgba(255,255,255,.08)}.breath-orb.phase-inhale{animation:inhale var(--phase-duration) linear forwards}.breath-orb.phase-hold{transform:scale(1.08);box-shadow:inset 0 0 58px rgba(242,201,76,.12),0 0 82px rgba(105,224,214,.2)}.breath-orb.phase-exhale{animation:exhale var(--phase-duration) linear forwards}@keyframes inhale{from{transform:scale(.82)}to{transform:scale(1.08)}}@keyframes exhale{from{transform:scale(1.08)}to{transform:scale(.82)}}@media(prefers-reduced-motion:reduce){.breath-orb.phase-inhale,.breath-orb.phase-exhale{animation:none}.breath-orb.phase-inhale{transform:scale(1.02)}.breath-orb.phase-exhale{transform:scale(.9)}}.phase-copy{position:relative;z-index:2;padding:0 14px}.phase-name{font-size:17px;font-weight:950;letter-spacing:-.02em}.phase-detail{margin-top:4px;color:#aee7e1;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}.timer{font-size:54px;font-weight:950;letter-spacing:-.06em;line-height:1;margin-top:8px}.timer small{font-size:15px;letter-spacing:0;color:var(--muted);margin-left:3px}.cycle{margin-top:8px;color:var(--muted);font-size:12px;font-weight:800}.phase-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 18px}.phase-pill{padding:10px 8px;border-radius:14px;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.025);text-align:center;color:#7faeaa;transition:.25s ease}.phase-pill strong{display:block;font-size:12px;color:inherit}.phase-pill span{display:block;font-size:10px;margin-top:3px;font-weight:750}.phase-pill.active{color:#effffc;border-color:rgba(105,224,214,.3);background:rgba(105,224,214,.09);box-shadow:inset 0 0 24px rgba(105,224,214,.05)}.settings{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 15px;margin-bottom:14px;border:1px solid rgba(255,255,255,.07);border-radius:18px;background:rgba(0,0,0,.12)}.settings-copy{min-width:0}.settings-copy label{display:block;font-size:12px;font-weight:900;color:#d9fbf7}.durations{margin-top:4px;color:var(--muted);font-size:11px;font-weight:700}.unit-control{display:flex;align-items:center;gap:7px;flex:0 0 auto}.unit-control button{width:35px;height:35px;border:0;border-radius:12px;background:rgba(105,224,214,.1);color:#dffffb;font-size:20px;font-weight:900;cursor:pointer}.unit-control input{width:44px;height:35px;border:1px solid rgba(105,224,214,.2);border-radius:12px;background:rgba(0,0,0,.2);color:#fff;text-align:center;font-weight:950;outline:none;-moz-appearance:textfield}.unit-control input::-webkit-inner-spin-button,.unit-control input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.unit-control button:disabled,.unit-control input:disabled{opacity:.38}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button{min-height:52px;border-radius:16px;border:1px solid transparent;font-weight:950;cursor:pointer;transition:transform .15s ease,filter .2s ease,opacity .2s ease}.actions button:active:not(:disabled){transform:translateY(1px) scale(.99)}.start{background:linear-gradient(135deg,#70e4da,#2bb8b2);color:#05292c;box-shadow:0 12px 30px rgba(43,184,178,.2)}.stop{background:rgba(255,143,143,.08);border-color:rgba(255,143,143,.22)!important;color:#ffd2d2}.actions button:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}@media(max-width:390px){.app{padding-inline:12px}.card{padding:20px 15px 16px;border-radius:26px}.visual{min-height:270px}.ring{width:232px;height:232px}.halo{width:220px;height:220px}.breath-orb{width:174px;height:174px}.timer{font-size:48px}}

<body>
  <main class="app">
    <section class="card" aria-label="Thirumoolar Pranayama breathing guide">
      <header class="title"><div class="mark"><img src="./icon128.png" alt=""></div><h1>Thirumoolar Pranayama</h1><p class="subtitle">Continuous guided breathwork · single bell chime</p><div class="ratio"><span>Purakam</span><i></i><span>Kumbakam</span><i></i><span>Rechakam</span> · 1:4:2</div></header>
      <div class="visual"><div class="halo"></div><svg class="ring" viewBox="0 0 120 120" aria-hidden="true"><circle class="track" cx="60" cy="60" r="56"></circle><circle class="progress" id="progressRing" cx="60" cy="60" r="56"></circle></svg><div class="breath-orb" id="breathOrb"><div class="phase-copy"><div class="phase-name" id="stageName">Ready to begin</div><div class="phase-detail" id="stageDetail">1 : 4 : 2</div><div class="timer" id="timer">--</div><div class="cycle" id="cycleCount">Cycle 0</div></div></div></div>
      <div class="phase-strip" aria-label="Breathing phases"><div class="phase-pill" id="phase0"><strong>பூரகம்</strong><span>Inhale · Left</span></div><div class="phase-pill" id="phase1"><strong>கும்பகம்</strong><span>Hold</span></div><div class="phase-pill" id="phase2"><strong>ரேசகம்</strong><span>Exhale · Right</span></div></div>
      <div class="settings"><div class="settings-copy"><label for="baseUnit">Inhale base unit</label><div class="durations" id="durations">4s inhale · 16s hold · 8s exhale</div></div><div class="unit-control"><button id="decreaseBtn" type="button" aria-label="Decrease base unit">−</button><input type="number" id="baseUnit" value="4" min="2" max="16" inputmode="numeric" aria-label="Inhale base unit in seconds"><button id="increaseBtn" type="button" aria-label="Increase base unit">+</button></div></div>
      <div class="actions"><button id="startBtn" class="start" type="button">Start breathing</button><button id="stopBtn" class="stop" type="button" disabled>Stop</button></div>
    </section>
  </main>
  <script>
    (()=>{const $=id=>document.getElementById(id),baseInput=$('baseUnit'),startBtn=$('startBtn'),stopBtn=$('stopBtn'),decreaseBtn=$('decreaseBtn'),increaseBtn=$('increaseBtn'),orb=$('breathOrb'),progressRing=$('progressRing'),circumference=2*Math.PI*56;progressRing.style.strokeDasharray=String(circumference);progressRing.style.strokeDashoffset=String(circumference);let isRunning=false,timerId=null,audioCtx=null,currentCycle=0,stageIndex=0,stageStartedAt=0,stageEndsAt=0,stages=[];const stageMeta=[{tamil:'பூரகம்',english:'INHALE',detail:'Left nostril',cls:'phase-inhale'},{tamil:'கும்பகம்',english:'HOLD',detail:'Retain',cls:'phase-hold'},{tamil:'ரேசகம்',english:'EXHALE',detail:'Right nostril',cls:'phase-exhale'}];function clampBase(v){return Math.max(2,Math.min(16,Number.parseInt(v,10)||4))}function updateDurations(){const b=clampBase(baseInput.value);baseInput.value=String(b);$('durations').textContent=`${b}s inhale · ${b*4}s hold · ${b*2}s exhale`}function playChime(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='sine';osc.frequency.setValueAtTime(528,audioCtx.currentTime);gain.gain.setValueAtTime(.34,audioCtx.currentTime);gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+2);osc.connect(gain);gain.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+2)}function setPhaseVisual(index,duration){document.querySelectorAll('.phase-pill').forEach((pill,i)=>pill.classList.toggle('active',i===index));const m=stageMeta[index];$('stageName').textContent=`${m.tamil} · ${m.english}`;$('stageDetail').textContent=m.detail;orb.classList.remove('phase-inhale','phase-hold','phase-exhale');orb.style.setProperty('--phase-duration',`${duration}s`);void orb.offsetWidth;orb.classList.add(m.cls)}function setRingProgress(p){const safe=Math.max(0,Math.min(1,p));progressRing.style.strokeDashoffset=String(circumference*(1-safe))}function updateRunningUI(now=performance.now()){const remainingMs=Math.max(0,stageEndsAt-now),durationMs=Math.max(1,stageEndsAt-stageStartedAt),time=Math.max(1,Math.ceil(remainingMs/1000));$('timer').innerHTML=`${time}<small>s</small>`;$('cycleCount').textContent=`Continuous cycle ${currentCycle}`;setRingProgress(1-(remainingMs/durationMs))}function beginStage(index,now){stageIndex=index;const duration=stages[index].duration;stageStartedAt=now;stageEndsAt=now+duration*1000;setPhaseVisual(index,duration);playChime();updateRunningUI(now)}function tick(){if(!isRunning)return;const now=performance.now();if(now>=stageEndsAt){let next=stageIndex+1;if(next>=stages.length){next=0;currentCycle+=1}beginStage(next,now);return}updateRunningUI(now)}function startSession(){if(isRunning)return;const b=clampBase(baseInput.value);baseInput.value=String(b);stages=[{duration:b},{duration:b*4},{duration:b*2}];isRunning=true;currentCycle=1;startBtn.disabled=true;stopBtn.disabled=false;baseInput.disabled=true;decreaseBtn.disabled=true;increaseBtn.disabled=true;beginStage(0,performance.now());timerId=window.setInterval(tick,100)}function stopSession(){isRunning=false;if(timerId)window.clearInterval(timerId);timerId=null;startBtn.disabled=false;stopBtn.disabled=true;baseInput.disabled=false;decreaseBtn.disabled=false;increaseBtn.disabled=false;orb.classList.remove('phase-inhale','phase-hold','phase-exhale');document.querySelectorAll('.phase-pill').forEach(p=>p.classList.remove('active'));$('stageName').textContent='Session ended';$('stageDetail').textContent='1 : 4 : 2';$('timer').textContent='--';$('cycleCount').textContent=`Cycle ${currentCycle}`;setRingProgress(0)}decreaseBtn.addEventListener('click',()=>{baseInput.value=String(clampBase(Number(baseInput.value)-1));updateDurations()});increaseBtn.addEventListener('click',()=>{baseInput.value=String(clampBase(Number(baseInput.value)+1));updateDurations()});baseInput.addEventListener('change',updateDurations);baseInput.addEventListener('blur',updateDurations);startBtn.addEventListener('click',startSession);stopBtn.addEventListener('click',stopSession);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&isRunning)tick()});updateDurations();if('serviceWorker'in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{})})})();
  </script>
