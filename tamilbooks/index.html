<!doctype html>
<html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f1e6"><link rel="icon" type="image/svg+xml" href="/assets/sharecapsule-logo.svg?v=3"><title>தமிழ் புத்தகங்கள் · Share Capsule</title>
<style>
:root{--paper:#f7f1e6;--ink:#211d18;--muted:#786f64;--line:#dfd5c7;--card:#fffdf8;--accent:#7a4d2a;--w:720px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,select,input{font:inherit;color:inherit}.shell{width:min(1080px,100%);margin:auto;padding:18px 18px 90px}.top,.readerBar{display:flex;align-items:center;gap:10px}.top{justify-content:space-between}.brand{font-size:20px;font-weight:900;color:inherit;text-decoration:none}.hero{max-width:720px;padding:52px 0 28px}.hero small{font-weight:850;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}.hero h1{font:700 clamp(46px,10vw,78px)/.94 Georgia,serif;letter-spacing:-.05em;margin:10px 0 14px}.hero p,.status{color:var(--muted);line-height:1.6}.library{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}.book{border:1px solid var(--line);background:var(--card);border-radius:24px;padding:14px;display:flex;flex-direction:column;text-align:left;cursor:pointer;box-shadow:0 14px 35px #3d2d1c0f}.cover{aspect-ratio:2/3;border-radius:18px;overflow:hidden;background:linear-gradient(145deg,#17233a,#3a315a);display:grid;place-items:center;color:#fff;font:700 25px Georgia,serif;text-align:center}.cover img{width:100%;height:100%;object-fit:cover}.book h2{font:700 28px/1.05 Georgia,serif;margin:14px 6px 8px}.book p{color:var(--muted);margin:0 6px 18px}.open{font-weight:850;margin:6px}.reader{display:none}.reader.active{display:block}.hidden{display:none!important}.readerInner{width:min(100%,var(--w));margin:auto}.readerBar{position:sticky;top:0;z-index:10;padding:10px 0;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.readerBar button{border:0;background:transparent;padding:10px;font-weight:800}.spacer{flex:1}.progress{height:3px;background:var(--line);position:sticky;top:65px;z-index:11}.progress span{display:block;height:100%;background:var(--accent);width:0}.scene{height:min(44vh,400px);margin:0 calc(50% - 50vw) 28px;display:grid;place-items:end center;position:relative;overflow:hidden;background:linear-gradient(180deg,#101327,#292f5e 58%,#795d86);color:#fff;background-size:cover;background-position:center}.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0009,transparent 65%)}.sceneText{position:relative;z-index:2;text-align:center;padding:36px 20px}.scene h1{font:700 clamp(38px,9vw,64px)/1 Georgia,serif;margin:8px 0}.scene small{letter-spacing:.15em;text-transform:uppercase}.chapterHead{text-align:center;padding:24px 0 24px}.chapterHead h2{font:700 clamp(32px,7vw,50px)/1.05 Georgia,serif;margin:10px}.muted{color:var(--muted)}.prose{font:var(--fs,20px)/var(--lh,1.85) Georgia,"Times New Roman",serif;letter-spacing:.005em}.prose p{margin:0 0 1.35em}.prose>p:first-of-type:first-letter{float:left;font-size:4.1em;line-height:.78;padding:.08em .1em 0 0;color:var(--accent)}.prose h1,.prose h2,.prose h3{line-height:1.2;margin:1.5em 0 .7em}.prose hr{border:0;text-align:center;margin:2.5em}.prose hr:after{content:"◆  ◆  ◆";font-size:9px;letter-spacing:8px;color:var(--muted)}.chapterNav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:55px 0}.chapterNav button{min-height:58px;border:1px solid var(--line);background:var(--card);border-radius:16px;font-weight:850}.chapterNav button:disabled{opacity:.35}.drawer{position:fixed;inset:0 0 0 auto;width:min(88vw,380px);background:var(--card);z-index:30;padding:24px;transform:translateX(105%);transition:.22s;box-shadow:-20px 0 60px #0003}.drawer.open{transform:none}.drawer .close{border:1px solid var(--line);background:transparent;border-radius:50%;width:42px;height:42px}.chapterList button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px}.chapterList .active{font-weight:900;color:var(--accent)}.settings label{display:block;font-weight:800;margin:18px 0 8px}.settings select,.settings input{width:100%}body.dark{--paper:#181715;--ink:#eee8df;--muted:#aaa095;--line:#37332e;--card:#211f1c;--accent:#d9a574}body.sepia{--paper:#efe2c8;--ink:#3b2b20;--muted:#756252;--line:#d4c09e;--card:#f6ead1;--accent:#85542d}
</style></head><body><main class="shell"><section id="libraryView"><header class="top"><a class="brand" href="../">Share Capsule</a><button id="refresh">↻</button></header><div class="hero"><small>Share Capsule வாசிப்பு</small><h1>தமிழ் புத்தகங்கள்</h1><p>தமிழ் கதைகள் மற்றும் தொடர்களை அத்தியாயம் அத்தியாயமாக வாசிக்கவும்.</p></div><div id="status" class="status">தமிழ் கதைகள் ஏற்றப்படுகின்றன…</div><div id="library" class="library"></div></section>
<section id="reader" class="reader"><div class="readerInner"><div class="readerBar"><button id="back">← நூலகம்</button><span class="spacer"></span><button id="chapters">☰ அத்தியாயங்கள்</button><button id="prefs">Aa</button></div><div class="progress"><span id="progress"></span></div><div id="scene" class="scene"><div class="sceneText"><small id="sceneMood">Share Capsule தமிழ் கதை</small><h1 id="cinemaTitle"></h1><div id="cinemaMeta"></div></div></div><header class="chapterHead"><div id="novelName" class="muted"></div><h2 id="chapterTitle"></h2><div id="chapterCount" class="muted"></div></header><article id="prose" class="prose"></article><nav class="chapterNav"><button id="prev">← முந்தையது</button><button id="next">அடுத்தது →</button></nav></div></section></main>
<aside id="chapterDrawer" class="drawer"><button class="close" onclick="closeDrawers()">×</button><h2>அத்தியாயங்கள்</h2><div id="chapterList" class="chapterList"></div></aside><aside id="settingsDrawer" class="drawer settings"><button class="close" onclick="closeDrawers()">×</button><h2>வாசிப்பு அமைப்புகள்</h2><label>தோற்றம்</label><select id="theme"><option value="">Paper</option><option value="sepia">Sepia</option><option value="dark">Dark</option></select><label>எழுத்து அளவு</label><input id="fontSize" type="range" min="17" max="28" value="20"><label>வரி இடைவெளி</label><input id="lineHeight" type="range" min="15" max="24" value="19"></aside>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script>
const OWNER='ananthaprakashb',REPO='tamilstories',BRANCH='main',API='https://api.github.com/repos/'+OWNER+'/'+REPO;let books=[],currentBook=null,currentChapter=0,chapterMeta={};const $=id=>document.getElementById(id),pretty=s=>decodeURIComponent(s).replace(/[-_]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase()),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function asset(book,v){if(!v)return'';if(/^https?:/i.test(v))return v;return'https://raw.githubusercontent.com/'+OWNER+'/'+REPO+'/'+BRANCH+'/'+book.path+'/'+v.replace(/^\.\//,'')}async function api(path){const r=await fetch(API+path,{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw Error('GitHub '+r.status);return r.json()}function natural(a,b){return a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'})}
async function loadLibrary(){$('status').textContent='தமிழ் கதைகள் ஏற்றப்படுகின்றன…';try{const root=await api('/contents?ref='+BRANCH);books=await Promise.all(root.filter(x=>x.type==='dir').map(async d=>{const files=await api('/contents/'+encodeURIComponent(d.path)+'?ref='+BRANCH),chapters=files.filter(f=>f.type==='file'&&/\.(md|markdown|txt)$/i.test(f.name)&&!/^readme/i.test(f.name)).sort(natural);let meta={};const mf=files.find(f=>f.type==='file'&&f.name.toLowerCase()==='book.json');if(mf)try{meta=await(await fetch(mf.download_url)).json()}catch{}return{name:meta.title||pretty(d.name),path:d.path,chapters,meta}}));books=books.filter(b=>b.chapters.length);$('status').textContent=books.length+' புத்தகம்'+(books.length===1?'':'கள்')+' உள்ளது';$('library').innerHTML=books.map((b,i)=>{const cover=asset(b,b.meta.artwork);return'<button class="book" data-i="'+i+'"><div class="cover">'+(cover?'<img src="'+esc(cover)+'" alt="'+esc(b.name)+' cover">':esc(b.name))+'</div><h2>'+esc(b.name)+'</h2><p>'+esc(b.meta.subtitle||b.meta.description||b.chapters.length+' அத்தியாயங்கள்')+'</p><span class="open">வாசிக்க தொடங்கு →</span></button>'}).join('');document.querySelectorAll('.book').forEach(x=>x.onclick=()=>openBook(+x.dataset.i))}catch(e){$('status').textContent='தமிழ் கதைகளை ஏற்ற முடியவில்லை: '+e.message}}
async function openBook(i){currentBook=books[i];let saved={};try{saved=JSON.parse(localStorage.getItem('tamilbook-progress:'+currentBook.path)||'{}')}catch{}currentChapter=Math.min(saved.chapter||0,currentBook.chapters.length-1);$('libraryView').classList.add('hidden');$('reader').classList.add('active');await loadChapter(currentChapter)}function front(raw){if(!raw.startsWith('---'))return{meta:{},body:raw};const lines=raw.replace(/\r/g,'').split('\n'),end=lines.indexOf('---',1);if(end<0)return{meta:{},body:raw};const meta={};lines.slice(1,end).forEach(line=>{const p=line.indexOf(':');if(p>0)meta[line.slice(0,p).trim().toLowerCase()]=line.slice(p+1).trim().replace(/^['"]|['"]$/g,'')});return{meta,body:lines.slice(end+1).join('\n').trim()}}
async function loadChapter(i){currentChapter=i;const ch=currentBook.chapters[i];$('prose').innerHTML='<p>அத்தியாயம் ஏற்றப்படுகிறது…</p>';try{const r=await fetch(ch.download_url);if(!r.ok)throw Error('Chapter '+r.status);const parsed=front(await r.text());chapterMeta=parsed.meta;$('prose').innerHTML=marked.parse(parsed.body);const fallback=pretty(ch.name.replace(/\.(md|markdown|txt)$/i,'').replace(/^\d+[._ -]*/,'')),title=chapterMeta.chapter_title||chapterMeta.title||fallback;$('novelName').textContent=currentBook.name;$('chapterTitle').textContent=title;$('chapterCount').textContent='அத்தியாயம் '+(i+1)+' / '+currentBook.chapters.length;$('cinemaTitle').textContent=title;$('sceneMood').textContent=(chapterMeta.scene||chapterMeta.mood||'கதை')+' · '+currentBook.name;$('cinemaMeta').textContent=chapterMeta.subtitle||('அத்தியாயம் '+(i+1));const art=chapterMeta.artwork||currentBook.meta.artwork;$('scene').style.backgroundImage=art?'linear-gradient(0deg,#0007,#0001),url("'+asset(currentBook,art)+'")':''}catch(e){$('prose').innerHTML='<p>அத்தியாயத்தை ஏற்ற முடியவில்லை: '+esc(e.message)+'</p>'}renderChapters();$('prev').disabled=i===0;$('next').disabled=i===currentBook.chapters.length-1;localStorage.setItem('tamilbook-progress:'+currentBook.path,JSON.stringify({chapter:i}));scrollTo(0,0)}
function renderChapters(){$('chapterList').innerHTML=currentBook.chapters.map((c,i)=>'<button data-i="'+i+'" class="'+(i===currentChapter?'active':'')+'">'+(i+1)+'. '+esc(pretty(c.name.replace(/\.(md|markdown|txt)$/i,'').replace(/^\d+[._ -]*/,'')))+'</button>').join('');$('chapterList').querySelectorAll('button').forEach(b=>b.onclick=()=>{closeDrawers();loadChapter(+b.dataset.i)})}function closeDrawers(){document.querySelectorAll('.drawer').forEach(x=>x.classList.remove('open'))}$('back').onclick=()=>{$('reader').classList.remove('active');$('libraryView').classList.remove('hidden')};$('prev').onclick=()=>currentChapter&&loadChapter(currentChapter-1);$('next').onclick=()=>currentChapter<currentBook.chapters.length-1&&loadChapter(currentChapter+1);$('chapters').onclick=()=>$('chapterDrawer').classList.add('open');$('prefs').onclick=()=>$('settingsDrawer').classList.add('open');$('refresh').onclick=loadLibrary;const pref=JSON.parse(localStorage.getItem('tamilbook-reader-prefs')||'{}');$('theme').value=pref.theme||'';$('fontSize').value=pref.fontSize||20;$('lineHeight').value=pref.lineHeight||19;function applyPrefs(){document.body.className=$('theme').value;document.documentElement.style.setProperty('--fs',$('fontSize').value+'px');document.documentElement.style.setProperty('--lh',$('lineHeight').value/10);localStorage.setItem('tamilbook-reader-prefs',JSON.stringify({theme:$('theme').value,fontSize:$('fontSize').value,lineHeight:$('lineHeight').value}))}['theme','fontSize','lineHeight'].forEach(id=>$(id).oninput=applyPrefs);applyPrefs();addEventListener('scroll',()=>{if(!$('reader').classList.contains('active'))return;const h=document.documentElement.scrollHeight-innerHeight;$('progress').style.width=(h?Math.min(100,scrollY/h*100):0)+'%'});loadLibrary();
</script><!-- Cloudflare Web Analytics --><script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token":"0eea133492b342da911e8cc91271e622"}'></script><!-- End Cloudflare Web Analytics --></body></html>
